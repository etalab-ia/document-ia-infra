name: Install Gitleaks
description: Install SHA-256 verified Gitleaks binary (v8.30.1) on Linux x64.

runs:
  using: composite
  steps:
    - name: Download, verify SHA-256 and install Gitleaks v8.30.1
      shell: bash
      run: |
        set -euo pipefail
        GITLEAKS_VERSION="8.30.1"
        GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        TMP_GL_DIR="$(mktemp -d)"
        trap 'rm -rf "${TMP_GL_DIR}"' EXIT
        curl --proto '=https' --tlsv1.2 --retry 3 --connect-timeout 15 --max-time 60 -sSfL \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o "${TMP_GL_DIR}/gitleaks.tar.gz"
        echo "${GITLEAKS_SHA256}  ${TMP_GL_DIR}/gitleaks.tar.gz" | sha256sum -c -
        tar -xzf "${TMP_GL_DIR}/gitleaks.tar.gz" -C "${TMP_GL_DIR}" gitleaks
        sudo install -m 0755 "${TMP_GL_DIR}/gitleaks" /usr/local/bin/gitleaks
        gitleaks version
