name: document-ia-infra CI

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:
  workflow_dispatch:

# Aucun droit par défaut : chaque job déclare uniquement ce dont il a besoin.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uv-lock:
    name: uv (verrou de dépendances)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Vérifier la cohérence du verrou uv.lock
        run: uv lock --check

  build-lint-test:
    name: Build, Lint, Pyright & Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Installer les dépendances (lockfile strict)
        run: uv sync --locked

      - name: Construire les artefacts Python (wheel & sdist)
        run: uv build

      - name: Ruff - Lint
        run: uv run ruff check lib stacks scripts tests

      - name: Ruff - Formatage
        run: uv run ruff format --check lib stacks scripts tests

      - name: Pyright - Typage statique (bloquant)
        run: uv run pyright

      - name: Pytest - Tests unitaires
        run: uv run pytest --maxfail=1 --disable-warnings

  gitleaks:
    name: Gitleaks (historique complet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Historique 100 % sain (zéro baseline historique) ; toute détection fait
    # échouer la CI. La sonde synthétique vérifie en outre la détection active
    # ainsi que l'exclusion explicite de .env.local.example.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          rm -f /tmp/gitleaks.tar.gz
          gitleaks version

      - name: Gitleaks (historique Git complet)
        run: |
          gitleaks git --config .gitleaks.toml --verbose --redact .

      - name: Vérifier les sondes synthétiques et l'exclusion .env.local.example
        run: |
          bash scripts/verify_gitleaks_synthetic.sh
