[project]
name = "document-ia-infra"
version = "0.1.0"
description = "Infrastructure as Code Document IA (Pulumi Python 3.14 + Scaleway + Nix)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pulumi>=3.150.0",
    "pulumiverse-scaleway>=1.20.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.9.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/infra_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["lib", "stacks", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["lib", "stacks", "scripts", "tests"]
extraPaths = ["lib", "stacks"]
typeCheckingMode = "standard"
