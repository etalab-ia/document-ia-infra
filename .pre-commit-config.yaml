# Installe les hooks aux étapes pre-commit et pre-push :
# - pre-commit : gitleaks-system scanne les modifications stagées (diff de l'index) ;
# - pre-push : scripts/gitleaks_pre_push.sh scanne les commits sortants
#   (au push, l'index est vide, un scan --staged ne détecterait rien).
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # v0.17.5
    hooks:
      - id: ruff-check
        args: [ --fix ]
        files: ^(lib|stacks|scripts|tests)/.*\.py$
      - id: ruff-format
        files: ^(lib|stacks|scripts|tests)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks-system
        args: ["--config", ".gitleaks.toml"]
        stages: [pre-commit]

  # Scan gitleaks des commits sortants au push : l'index est vide à ce stade,
  # le hook pre-commit (--staged) ne détecterait rien.
  - repo: local
    hooks:
      - id: gitleaks-pre-push
        name: gitleaks pre-push (commits sortants)
        language: system
        entry: bash scripts/gitleaks_pre_push.sh
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Verrouillage unique à la racine : toute modification de pyproject.toml met à jour uv.lock.
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        language: system
        pass_filenames: false
        files: ^pyproject\.toml$
        entry: uv lock
